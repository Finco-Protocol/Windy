name: CI

# Small and fast: two jobs, no deploy steps, no secrets.
# - backend: pip install + pytest
# - frontend: locked pnpm install + Vitest + vue-tsc + production build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: frontend (vitest + vue-tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The packageManager field lives in frontend/package.json, not the repo
      # root, so pin the pnpm version explicitly for the action.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile
      - name: Unit tests
        working-directory: frontend
        run: corepack pnpm vitest run
      - name: Type-check
        working-directory: frontend
        run: corepack pnpm type-check
      - name: Production build
        working-directory: frontend
        run: corepack pnpm build
